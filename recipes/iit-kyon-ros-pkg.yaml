clone:
  type: git
  server: github.com
  repository: advrhumanoids/iit-kyon-ros-pkg.git
  tag: ros2
  ros_src: true

build:
  type: cmake
  cmakelists:
    - kyon_urdf: kyon_urdf
    - kyon_srdf: kyon_srdf
    - kyon_gazebo: kyon_gazebo
    - kyon_config: kyon_config
    - kyon_mujoco: kyon_mujoco
    - kyon_cartesio: kyon_cartesio
    - kyon_isaac: kyon_isaac


depends:
  - xbot2_ros
  - velodyne_simulator
  - velodyne_description
  - xbot2_mujoco

system_depends:
  - ros-jazzy-ros-gz
