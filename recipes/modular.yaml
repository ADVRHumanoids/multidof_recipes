clone:
  type: git
  server: github.com
  repository: advrhumanoids/modular_hhcm.git
  tag: ros2
  recursive: true
  ros_src: true

pre_build:
  - |
    if [ -f "{srcdir}/setup.py" ]; then
      pip install -e {srcdir}
    fi

build:
  type: cmake
  cmakelists:
    - modular: .
    - modular_resources: src/modular/modular_resources