clone:
  type: git
  server: github.com
  repository: advrhumanoids/iit-concert-ros-pkg.git
  tag: ros2
  ros_src: true
  recursive: true

build:
  type: cmake
  cmakelists:
    - concert_resources: concert_resources
    - concert_urdf: concert_urdf
    - concert_srdf: concert_srdf
    - concert_usd: concert_usd
    - concert_gazebo: concert_gazebo
    - concert_odometry_ros2: concert_odometry_ros2
    - concert_examples: concert_examples
    - concert_cartesio: concert_cartesio
    - concert_isaac: concert_isaac
    - concert_tests: concert_tests
depends:
  - modular
  - velodyne_simulator
  - xbot2_gui_server
  - xbot2_ros
  - concert_launcher
