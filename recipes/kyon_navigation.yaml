clone:
  type: git
  server: github.com
  repository: advrhumanoids/kyon_navigation.git
  tag: master
  recursive: true

build:
  type: cmake
  cmakelists:
    - kyon_navigation: .
  args_if:
    robot:
      - -DKYON_NAVIGATION_SIM=OFF

# The sim's robot (URDFs, XBot2 on MuJoCo); on the robot XBot2 is already installed.
depends_if:
  "not mode('robot')":
    - iit-kyon-ros-pkg

system_depends:
  - ros-jazzy-nav2-planner
  - ros-jazzy-nav2-controller
  - ros-jazzy-nav2-mppi-controller
  - ros-jazzy-nav2-smac-planner
  - ros-jazzy-nav2-bt-navigator
  - ros-jazzy-nav2-lifecycle-manager
  - ros-jazzy-nav2-costmap-2d
  - ros-jazzy-nav2-rviz-plugins
  - ros-jazzy-grid-map-core
  - ros-jazzy-grid-map-ros
  - ros-jazzy-grid-map-msgs
  - ros-jazzy-robot-state-publisher
  - ros-jazzy-pluginlib
  - ros-jazzy-tf2-ros
  - ros-jazzy-pcl-conversions
  - ros-jazzy-teleop-twist-keyboard
